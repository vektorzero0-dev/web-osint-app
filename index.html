<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEKTOR ZERO - Enterprise OSINT Suite</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --primary-blue: #2563eb;
            --cyan-accent: #38bdf8;
            --green-accent: #10b981;
            --amber-accent: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-box h1 {
            font-size: 20px;
            letter-spacing: 2px;
            margin: 0;
            color: var(--cyan-accent);
        }

        .title-box span {
            font-size: 11px;
            color: var(--text-muted);
        }

        .status-badge {
            font-size: 11px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--green-accent);
            border: 1px solid var(--green-accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .card-header h2 {
            font-size: 16px;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="file"] {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--cyan-accent);
        }

        .btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .result-box {
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #d1d5db;
            overflow-x: auto;
            margin-top: 10px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .hash-box {
            background: #0f172a;
            border-left: 3px solid var(--amber-accent);
            padding: 8px 12px;
            font-size: 11px;
            font-family: monospace;
            margin-bottom: 10px;
        }

        .links-flex {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .osint-btn {
            background: #0284c7;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
        }

        .osint-btn:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="title-box">
            <h1>VEKTOR ZERO</h1>
            <span>v5.1 SECURE OSINT SUITE</span>
        </div>
        <div class="status-badge">● SYSTEM ONLINE</div>
    </div>

    <!-- Modul 1: Metadata & File Analysis -->
    <div class="card">
        <div class="card-header">
            <span style="font-size: 20px;">📁</span>
            <h2>METADATA & DOCUMENT EXTRACTOR</h2>
        </div>
        <div class="input-group">
            <label>Pilih Berkas Target (Gambar, PDF, DOCX)</label>
            <input type="file" id="fileInput" onchange="uploadFileForMetadata()">
        </div>

        <div id="fileResultContainer" style="display: none;">
            <!-- Hash Integrity -->
            <div class="hash-box">
                <strong style="color: var(--amber-accent);">EVIDENCE HASH (CHAIN OF CUSTODY):</strong><br>
                <span>MD5: </span><span id="hashMd5" style="color: #a7f3d0;">-</span><br>
                <span>SHA256: </span><span id="hashSha256" style="color: #a7f3d0;">-</span>
            </div>

            <!-- GPS OSINT Links -->
            <div id="osintLinksContainer" style="display: none; margin-bottom: 10px;">
                <label style="color: var(--green-accent);">NAVIGASI OSINT GEOLOKASI:</label>
                <div id="osintLinksList" class="links-flex"></div>
            </div>

            <!-- Metadata Output -->
            <label>RAW METADATA OUTPUT:</label>
            <div id="metadataOutput" class="result-box">Memproses berkas...</div>
        </div>
    </div>

    <!-- Modul 2: Domain & IP Recon -->
    <div class="card">
        <div class="card-header">
            <span style="font-size: 20px;">🔍</span>
            <h2>DOMAIN & IP RECON</h2>
        </div>
        <div class="input-group">
            <label>Masukkan Target Domain / IP</label>
            <input type="text" id="targetInput" placeholder="contoh: target-domain.com">
        </div>
        <button class="btn" onclick="executeScan()">LACAK TARGET DOMAIN</button>

        <div id="scanResultContainer" style="display: none;">
            <div id="scanOutput" class="result-box" style="margin-top: 15px;">Memindai target...</div>
        </div>
    </div>
</div>

<script>
    // 1. Fungsi Unggah & Analisis Metadata Berkas (Fitur 3 & 4)
    async function uploadFileForMetadata() {
        const fileInput = document.getElementById("fileInput");
        const file = fileInput.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append("file", file);

        const resultContainer = document.getElementById("fileResultContainer");
        const hashMd5 = document.getElementById("hashMd5");
        const hashSha256 = document.getElementById("hashSha256");
        const osintLinksContainer = document.getElementById("osintLinksContainer");
        const osintLinksList = document.getElementById("osintLinksList");
        const metadataOutput = document.getElementById("metadataOutput");

        resultContainer.style.display = "block";
        metadataOutput.textContent = "Sedang mengekstrak metadata dan mengkalkulasi hash...";
        osintLinksContainer.style.display = "none";

        try {
            const response = await fetch("/api/metadata", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                // Tampilkan Hash
                hashMd5.textContent = data.hashes.md5;
                hashSha256.textContent = data.hashes.sha256;

                // Tampilkan Link OSINT jika ada data GPS
                osintLinksList.innerHTML = "";
                if (data.osint_links && Object.keys(data.osint_links).length > 0) {
                    osintLinksContainer.style.display = "block";
                    for (const [key, url] of Object.entries(data.osint_links)) {
                        const btn = document.createElement("a");
                        btn.href = url;
                        btn.target = "_blank";
                        btn.className = "osint-btn";
                        btn.textContent = key.replace("_", " ").toUpperCase();
                        osintLinksList.appendChild(btn);
                    }
                }

                // Tampilkan Metadata JSON
                metadataOutput.textContent = JSON.stringify(data.metadata, null, 2);
            } else {
                metadataOutput.textContent = "[Error] Gagal meng-ekstrak metadata berkas.";
            }
        } catch (error) {
            console.error(error);
            metadataOutput.textContent = "[Error] Terjadi kesalahan koneksi ke server backend.";
        }
    }

    // 2. Fungsi Pemindaian Domain & IP
    async function executeScan() {
        const targetInput = document.getElementById("targetInput").value.trim();
        const scanResultContainer = document.getElementById("scanResultContainer");
        const scanOutput = document.getElementById("scanOutput");

        if (!targetInput) {
            alert("Harap masukkan target domain atau IP!");
            return;
        }

        scanResultContainer.style.display = "block";
        scanOutput.textContent = `[+] Memulai investigasi pada target: ${targetInput}...\nMohon tunggu...`;

        try {
            const response = await fetch(`/api/scan?target=${encodeURIComponent(targetInput)}`);
            const result = await response.json();

            if (result.success) {
                scanOutput.textContent = JSON.stringify(result.data, null, 2);
            } else {
                scanOutput.textContent = `[Error] Gagal memindai target.`;
            }
        } catch (error) {
            console.error(error);
            scanOutput.textContent = `[Error] Terjadi kesalahan koneksi ke server backend.`;
        }
    }
</script>

</body>
</html>
