<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEKTOR ZERO - OSINT Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050811;
            --panel: #0d1322;
            --border: #1e293b;
            --accent-cyan: #00f2fe;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --text: #f1f5f9;
            --text-dim: #64748b;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 24px; display: flex; justify-content: center; }
        .wrapper { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }

        .brand-header {
            background: linear-gradient(135deg, rgba(13,19,34,0.9), rgba(5,8,17,0.9));
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent-cyan);
            border-radius: 10px;
            padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,242,254,0.05);
        }
        .brand-header h1 { margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 22px; color: var(--accent-cyan); letter-spacing: 1px; }
        .brand-header p { margin: 4px 0 0 0; font-size: 12px; color: var(--text-dim); }
        .sys-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent-green); background: rgba(16,185,129,0.1); border: 1px solid var(--accent-green); padding: 4px 10px; border-radius: 20px; }

        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
        .card-title { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: var(--accent-cyan); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        .input-box { display: flex; gap: 10px; margin-bottom: 14px; }
        input[type="text"], select { flex: 1; background: #02040a; border: 1px solid var(--border); color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 13px; font-family: 'JetBrains Mono', monospace; outline: none; }
        input[type="text"]:focus { border-color: var(--accent-cyan); }
        input[type="file"] { background: #02040a; border: 1px dashed var(--border); padding: 10px; border-radius: 6px; color: var(--text-dim); font-size: 12px; width: 100%; cursor: pointer; }

        .btn { background: linear-gradient(135deg, var(--accent-blue), #1d4ed8); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .data-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
        .data-table th, .data-table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; }
        .data-table th { background: rgba(255,255,255,0.02); color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
        .data-table td { font-family: 'JetBrains Mono', monospace; }

        .badge { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .badge-success { background: rgba(16,185,129,0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge-danger { background: rgba(239,68,68,0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .badge-info { background: rgba(59,130,246,0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); }

        .hash-card { background: #02040a; border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; margin-bottom: 12px; }
        .hash-card span { color: var(--accent-cyan); word-break: break-all; }
        .link-btn { display: inline-block; background: rgba(0,242,254,0.1); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); padding: 4px 10px; border-radius: 4px; text-decoration: none; font-size: 11px; margin-right: 6px; margin-top: 6px; }
        .link-btn:hover { background: var(--accent-cyan); color: #000; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="brand-header">
        <div>
            <h1>VEKTOR ZERO OSINT</h1>
            <p>ADVANCED CYBER INTELLIGENCE DASHBOARD v7.0</p>
        </div>
        <div class="sys-badge">● ENGINE ONLINE</div>
    </div>

    <!-- Modul 1: Metadata -->
    <div class="card">
        <div class="card-title">📁 METADATA & FORENSIC ANALYZER</div>
        <input type="file" id="fileInput" onchange="processMetadata()">
        <div id="metaResult" style="display:none; margin-top: 14px;"></div>
    </div>

    <!-- Modul 2: Username -->
    <div class="card">
        <div class="card-title">👤 USERNAME RECONNAISSANCE</div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Username (misal: johndoe)">
            <button class="btn" onclick="processUsername()">Lacak Profile</button>
        </div>
        <div id="userResult" style="display:none;"></div>
    </div>

    <!-- Modul 3: Domain & Network -->
    <div class="card">
        <div class="card-title">🌐 DOMAIN & PORT RECON</div>
        <div class="input-box">
            <input type="text" id="domainInput" placeholder="Domain (misal: target.com)">
            <button class="btn" onclick="processDomain()">Scan Domain</button>
        </div>
        <div id="domainResult" style="display:none;"></div>
    </div>

    <!-- Modul 4: Email Intel (Baru) -->
    <div class="card">
        <div class="card-title">✉️ EMAIL OSINT & REPUTATION</div>
        <div class="input-box">
            <input type="text" id="emailInput" placeholder="Email (misal: target@domain.com)">
            <button class="btn" onclick="processEmail()">Analisis Email</button>
        </div>
        <div id="emailResult" style="display:none;"></div>
    </div>

    <!-- Modul 5: DNS Security (Baru) -->
    <div class="card">
        <div class="card-title">🛡️ DNS SECURITY ENUMERATION</div>
        <div class="input-box">
            <input type="text" id="dnsInput" placeholder="Domain (misal: target.com)">
            <button class="btn" onclick="processDNS()">Ekstrak DNS</button>
        </div>
        <div id="dnsResult" style="display:none;"></div>
    </div>

    <!-- Modul 6: IP Intel -->
    <div class="card">
        <div class="card-title">📍 IP GEOLOCATION INTELLIGENCE</div>
        <div class="input-box">
            <input type="text" id="ipInput" placeholder="IP Address (misal: 8.8.8.8)">
            <button class="btn" onclick="processIP()">Lacak IP</button>
        </div>
        <div id="ipResult" style="display:none;"></div>
    </div>
</div>

<script>
    async function processMetadata() {
        const file = document.getElementById("fileInput").files[0];
        if(!file) return;
        const fd = new FormData(); fd.append("file", file);
        const resBox = document.getElementById("metaResult");
        resBox.style.display = "block"; resBox.innerHTML = "<p style='font-size:12px; color:var(--text-dim)'>Mengekstrak metadata & kalkulasi hash...</p>";
        
        try {
            const res = await fetch("/api/metadata", { method: "POST", body: fd });
            const data = await res.json();
            if(data.success) {
                let osintHtml = "";
                if(data.osint_links) {
                    for(const [k, v] of Object.entries(data.osint_links)) {
                        osintHtml += `<a href="${v}" target="_blank" class="link-btn">📌 ${k}</a>`;
                    }
                }
                let metaRows = "";
                for(const [k, v] of Object.entries(data.metadata)) {
                    metaRows += `<tr><td style="color:var(--text-dim)">${k}</td><td>${v}</td></tr>`;
                }
                resBox.innerHTML = `
                    <div class="hash-card">
                        <div><strong>FILE:</strong> ${data.filename} (${data.file_size})</div>
                        <div><strong>MD5:</strong> <span>${data.hashes.md5}</span></div>
                        <div><strong>SHA256:</strong> <span>${data.hashes.sha256}</span></div>
                        ${osintHtml ? `<div style="margin-top:8px">${osintHtml}</div>` : ''}
                    </div>
                    <table class="data-table">
                        <thead><tr><th>Property</th><th>Value</th></tr></thead>
                        <tbody>${metaRows || '<tr><td colspan="2">No EXIF/Metadata found</td></tr>'}</tbody>
                    </table>`;
            }
        } catch(e) { resBox.innerHTML = "<span class='badge badge-danger'>Error Processing File</span>"; }
    }

    async function processUsername() {
        const u = document.getElementById("userInput").value;
        const resBox = document.getElementById("userResult");
        if(!u) return;
        resBox.style.display = "block"; resBox.innerHTML = "<p style='font-size:12px; color:var(--text-dim)'>Checking social footprint...</p>";
        
        try {
            const res = await fetch(`/api/recon/username?username=${encodeURIComponent(u)}`);
            const data = await res.json();
            let rows = "";
            data.results.forEach(r => {
                const stBadge = r.status === 'Found' ? '<span class="badge badge-success">FOUND</span>' : '<span class="badge badge-danger">NOT FOUND</span>';
                rows += `<tr><td>${r.platform}</td><td>${stBadge}</td><td><a href="${r.url}" target="_blank" class="link-btn">Kunjungi</a></td></tr>`;
            });
            resBox.innerHTML = `<table class="data-table"><thead><tr><th>Platform</th><th>Status</th><th>Link</th></tr></thead><tbody>${rows}</tbody></table>`;
        } catch(e) { resBox.innerHTML = "<span class='badge badge-danger'>Connection Error</span>"; }
    }

    async function processDomain() {
        const d = document.getElementById("domainInput").value;
        const resBox = document.getElementById("domainResult");
        if(!d) return;
        resBox.style.display = "block"; resBox.innerHTML = "<p style='font-size:12px; color:var(--text-dim)'>Scanning domain & ports...</p>";
        
        try {
            const res = await fetch(`/api/scan?target=${encodeURIComponent(d)}`);
            const data = await res.json();
            const info = data.data;
            let portBadges = "";
            for(const [p, st] of Object.entries(info.ports)) {
                portBadges += `<span class="badge ${st==='Open'?'badge-success':'badge-danger'}" style="margin-right:4px">${p}: ${st}</span>`;
            }
            resBox.innerHTML = `
                <table class="data-table">
                    <tr><td style="color:var(--text-dim)">Target</td><td><strong>${info.target}</strong></td></tr>
                    <tr><td style="color:var(--text-dim)">IP Address</td><td>${info.ip_address}</td></tr>
                    <tr><td style="color:var(--text-dim)">Status</td><td><span class="badge badge-info">${info.status}</span></td></tr>
                    <tr><td style="color:var(--text-dim)">Web Server</td><td>${info.web_server}</td></tr>
                    <tr><td style="color:var(--text-dim)">Registrar</td><td>${info.registrar}</td></tr>
                    <tr><td style="color:var(--text-dim)">Open Ports</td><td>${portBadges}</td></tr>
                </table>`;
        } catch(e) { resBox.innerHTML = "<span class='badge badge-danger'>Scan Error</span>"; }
    }

    async function processEmail() {
        const email = document.getElementById("emailInput").value;
        const resBox = document.getElementById("emailResult");
        if(!email) return;
        resBox.style.display = "block"; resBox.innerHTML = "<p style='font-size:12px; color:var(--text-dim)'>Analyzing email domain & MX...</p>";
        
        try {
            const res = await fetch(`/api/recon/email?email=${encodeURIComponent(email)}`);
            const data = await res.json();
            if(!data.success) { resBox.innerHTML = `<span class="badge badge-danger">${data.message}</span>`; return; }
            resBox.innerHTML = `
                <table class="data-table">
                    <tr><td style="color:var(--text-dim)">Email Target</td><td>${data.email}</td></tr>
                    <tr><td style="color:var(--text-dim)">Format Valid</td><td>${data.valid_syntax ? '<span class="badge badge-success">YES</span>':'<span class="badge badge-danger">NO</span>'}</td></tr>
                    <tr><td style="color:var(--text-dim)">Disposable Mail</td><td>${data.is_disposable ? '<span class="badge badge-danger">YES (TEMPORARY)</span>':'<span class="badge badge-success">NO (REAL EMAIL)</span>'}</td></tr>
                    <tr><td style="color:var(--text-dim)">MX Servers</td><td>${data.mx_records.join(", ") || "No MX Found"}</td></tr>
                </table>`;
        } catch(e) { resBox.innerHTML = "<span class='badge badge-danger'>Error Analyzing Email</span>"; }
    }

    async function processDNS() {
        const domain = document.getElementById("dnsInput").value;
        const resBox = document.getElementById("dnsResult");
        if(!domain) return;
        resBox.style.display = "block"; resBox.innerHTML = "<p style='font-size:12px; color:var(--text-dim)'>Enumerating DNS records...</p>";
        
        try {
            const res = await fetch(`/api/recon/dns-enum?domain=${encodeURIComponent(domain)}`);
            const data = await res.json();
            let rows = "";
            for(const [type, recs] of Object.entries(data.records)) {
                rows += `<tr><td><span class="badge badge-info">${type}</span></td><td>${recs.join("<br>") || "<span style='color:var(--text-dim)'>-</span>"}</td></tr>`;
            }
            resBox.innerHTML = `<table class="data-table"><thead><tr><th>Record Type</th><th>Data Value</th></tr></thead><tbody>${rows}</tbody></table>`;
        } catch(e) { resBox.innerHTML = "<span class='badge badge-danger'>DNS Enum Error</span>"; }
    }

    async function processIP() {
        const ip = document.getElementById("ipInput").value;
        const resBox = document.getElementById("ipResult");
        if(!ip) return;
        resBox.style.display = "block"; resBox.innerHTML = "<p style='font-size:12px; color:var(--text-dim)'>Locating IP Address...</p>";
        
        try {
            const res = await fetch(`/api/recon/ip-intel?ip=${encodeURIComponent(ip)}`);
            const data = await res.json();
            if(!data.success) { resBox.innerHTML = "<span class='badge badge-danger'>Failed IP Lookup</span>"; return; }
            const intel = data.ip_intel;
            resBox.innerHTML = `
                <table class="data-table">
                    <tr><td style="color:var(--text-dim)">IP Target</td><td><strong>${intel.query}</strong></td></tr>
                    <tr><td style="color:var(--text-dim)">Lokasi</td><td>${intel.city}, ${intel.regionName}, ${intel.country} (${intel.countryCode})</td></tr>
                    <tr><td style="color:var(--text-dim)">ISP / ASN</td><td>${intel.isp} / ${intel.as}</td></tr>
                    <tr><td style="color:var(--text-dim)">Koordinat</td><td><a href="https://maps.google.com/?q=${intel.lat},${intel.lon}" target="_blank" class="link-btn">📍 ${intel.lat}, ${intel.lon}</a></td></tr>
                </table>`;
        } catch(e) { resBox.innerHTML = "<span class='badge badge-danger'>IP Lookup Error</span>"; }
    }
</script>
</body>
</html>
